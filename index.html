<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="Connections Solver: solve the final eight words, highlight combinations, use game feedback, or import a screenshot.">
  <title>Connections Solver | By Rustin Terry</title>
  <link rel="stylesheet" href="styles.css?v=2">
  <script src="app.js?v=2" defer></script>
</head>
<body>
  <main class="app" aria-label="Connections Solver">
    <header class="app-heading">
      <h1>Connections Helper</h1>
      <p id="subtitle">Enter the 8 remaining words</p>
    </header>

    <div class="word-grid" id="word-grid" aria-label="Eight remaining words">
      <div class="word-slot"><input id="word-0" class="word-field" aria-label="Word 1" placeholder="Word 1" maxlength="50" enterkeyhint="next" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="word-tile" type="button" data-word="0" hidden></button></div>
      <div class="word-slot"><input id="word-1" class="word-field" aria-label="Word 2" placeholder="Word 2" maxlength="50" enterkeyhint="next" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="word-tile" type="button" data-word="1" hidden></button></div>
      <div class="word-slot"><input id="word-2" class="word-field" aria-label="Word 3" placeholder="Word 3" maxlength="50" enterkeyhint="next" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="word-tile" type="button" data-word="2" hidden></button></div>
      <div class="word-slot"><input id="word-3" class="word-field" aria-label="Word 4" placeholder="Word 4" maxlength="50" enterkeyhint="next" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="word-tile" type="button" data-word="3" hidden></button></div>
      <div class="word-slot"><input id="word-4" class="word-field" aria-label="Word 5" placeholder="Word 5" maxlength="50" enterkeyhint="next" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="word-tile" type="button" data-word="4" hidden></button></div>
      <div class="word-slot"><input id="word-5" class="word-field" aria-label="Word 6" placeholder="Word 6" maxlength="50" enterkeyhint="next" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="word-tile" type="button" data-word="5" hidden></button></div>
      <div class="word-slot"><input id="word-6" class="word-field" aria-label="Word 7" placeholder="Word 7" maxlength="50" enterkeyhint="next" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="word-tile" type="button" data-word="6" hidden></button></div>
      <div class="word-slot"><input id="word-7" class="word-field" aria-label="Word 8" placeholder="Word 8" maxlength="50" enterkeyhint="done" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="word-tile" type="button" data-word="7" hidden></button></div>
    </div>

    <div class="main-actions">
      <button id="generate" class="action action-primary" type="button">Generate Options</button>
      <button id="upload" class="action action-soft" type="button">Upload Words</button>
      <button id="paste" class="action action-soft" type="button">Paste</button>
      <button id="edit" class="action action-neutral" type="button" hidden>Edit</button>
      <input id="photo-file" type="file" accept="image/*" aria-label="Choose screenshot" hidden>
    </div>

    <section class="feedback-section" aria-label="Guess feedback">
      <p class="selected-guess" id="selected-guess">Choose a combination</p>
      <div class="feedback-controls">
        <button type="button" data-feedback="0" class="feedback-button correct">Correct</button>
        <button type="button" data-feedback="1" class="feedback-button away">1 Away</button>
        <button type="button" data-feedback="2" class="feedback-button away">2 Away</button>
      </div>
    </section>

    <section class="solutions-section" aria-label="Possible combinations">
      <div class="solutions-head">
        <button type="button" id="clear" class="minor-control">Clear</button>
        <div class="solutions-summary" aria-live="polite">
          <div class="summary-caption" id="feedback-caption">POSSIBLE COMBINATIONS</div>
          <div class="summary-count" id="solution-count">Enter 8 words</div>
        </div>
        <button type="button" id="swap" class="minor-control swap" aria-label="Swap displayed four-word groups" title="Show other group">⇄</button>
      </div>
      <p id="message" class="message" role="status" aria-live="polite" hidden></p>
      <div id="solutions" class="solutions-list"></div>
      <div class="utility-row"><button id="undo" class="utility" type="button" hidden>↶ Undo feedback</button><button id="new-puzzle" class="utility" type="button">New puzzle</button></div>
    </section>
    <p class="byline">By Rustin Terry</p>
  </main>

  <dialog id="ocr-dialog" class="ocr-dialog" aria-labelledby="ocr-heading">
    <div class="dialog-header"><h2 id="ocr-heading">Review recognized words</h2><button id="close-review" class="dialog-close" type="button" aria-label="Close">×</button></div>
    <p>Select the eight remaining words, then import. Correct any spelling in Edit mode.</p>
    <div id="ocr-choices" class="ocr-choices"></div>
    <div class="dialog-actions"><button id="import-eight" class="action action-primary" type="button">Import selected words</button></div>
  </dialog>
</body>
</html>
